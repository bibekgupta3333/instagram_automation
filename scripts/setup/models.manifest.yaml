# Local model manifest for the recommended stack in docs 14 (Apple M4 Pro, 24 GB).
#
# Read by scripts/setup/00-preflight.sh (disk requirement), 20-pull-models.sh
# (downloads) and 30-smoke-test.sh (presence checks) via scripts/setup/manifest.py.
#
# Fields
#   name            short id used by the scripts
#   stage           llm | tts | asr | image | music
#   purpose         what the pipeline uses it for
#   runtime         ollama (pulled with `ollama pull`) | hf (Hugging Face repo download)
#   source          Ollama tag or HF repo id
#   include         optional HF allow-patterns (only these files are downloaded)
#   size_gb         approximate download size, GB (decimal)
#   licence         weights licence (SPDX-ish)
#   commercial_use  true only for licences that allow monetised channels
# Default pull set (no --include-optional) = tts + asr + image. Text runs on Bedrock /
# Claude Code, so every llm model is optional.
#
#   optional        true = not pulled by default (needs --include-optional), not in the
#                   required disk total
#   verified        what was checked on 2026-10-16 (see `verified_how`); false = unverified
#
# Only commercially usable weights belong here. Non-commercial models (FLUX.1-dev,
# FLUX.2-klein-9B, Qwen-Image-2.1, F5-TTS, MusicGen, Higgs TTS 3) are excluded on purpose.

version: 1
checked: "2026-10-16"
disk_buffer_gb: 10

models:
  # ---------------------------------------------------------------- LLM
  # All optional: text runs on Bedrock / Claude Code (studio/llm). Kept for offline experiments.
  - name: qwen3.5-9b
    stage: llm
    purpose: "Workhorse: scripts, hooks, titles, tags, JSON metadata (doc 14 §3)"
    runtime: ollama
    source: "qwen3.5:9b"
    size_gb: 7.6
    licence: apache-2.0
    commercial_use: true
    optional: true   # text runs on Bedrock / Claude Code
    verified: true
    verified_how: "tag listed on ollama.com/library/qwen3.5/tags (7.6 GB); HF Qwen/Qwen3.5-9B licence apache-2.0"

  - name: gemma4-12b
    stage: llm
    purpose: "Workhorse alternative for A/B on voice and tone (doc 14 §3)"
    runtime: ollama
    source: "gemma4:12b"
    size_gb: 7.7
    licence: apache-2.0
    commercial_use: true
    optional: true   # text runs on Bedrock / Claude Code
    verified: true
    verified_how: "tag listed on ollama.com/library/gemma4/tags (7.7 GB); HF google/gemma-4-12B-it licence apache-2.0"

  - name: gpt-oss-20b
    stage: llm
    purpose: "Smart pass: fact-check critic, outline, planner agent (doc 14 §3)"
    runtime: ollama
    source: "gpt-oss:20b"
    size_gb: 14.0
    licence: apache-2.0
    commercial_use: true
    optional: true   # text runs on Bedrock / Claude Code (incl. fact-check)
    verified: true
    verified_how: "tag listed on ollama.com/library/gpt-oss/tags (14 GB); HF openai/gpt-oss-20b licence apache-2.0"

  # ---------------------------------------------------------------- TTS
  - name: kokoro-82m
    stage: tts
    purpose: "Default narrator via mlx-audio, preset/blended voices only (doc 14 §4)"
    runtime: hf
    source: "mlx-community/Kokoro-82M-bf16"
    # skip the duplicate voices/*.pt (torch) copies; mlx-audio loads voices/*.safetensors
    include: ["*.json", "*.safetensors", "voices/*.safetensors", "*.md", "*.txt"]
    size_gb: 0.4
    licence: apache-2.0
    commercial_use: true
    optional: false
    verified: true
    verified_how: "HF API: repo exists, licence apache-2.0, 0.39 GB. Upstream: hexgrad/Kokoro-82M"

  # ---------------------------------------------------------------- ASR
  - name: parakeet-tdt-0.6b-v2
    stage: asr
    purpose: "Word-level caption timings via parakeet-mlx (doc 14 §5). Credit NVIDIA (CC-BY-4.0)"
    runtime: hf
    source: "mlx-community/parakeet-tdt-0.6b-v2"
    size_gb: 2.5
    licence: cc-by-4.0
    commercial_use: true
    optional: false
    verified: true
    verified_how: "HF API: repo exists, licence cc-by-4.0, model.safetensors 2.47 GB"

  # ---------------------------------------------------------------- Image
  - name: flux2-klein-4b-q4
    stage: image
    purpose: "Default local still / keyframe model via mflux, 4-bit pre-quantized (doc 18 §1)"
    runtime: hf
    source: "mflux-community/flux2-klein-4b-mflux-q4"
    size_gb: 4.6
    licence: apache-2.0
    commercial_use: true
    optional: false
    verified: true
    verified_how: "HF file-tree API via doc 18 research: 4.57 GB (transformer 2.15, Qwen3 TE 2.27, VAE 0.17). M1 Max 31.7 s/image measured (lilting.ch). mflux --model <repo> form NOT yet tested"

  - name: z-image-turbo-q4
    stage: image
    purpose: "Higher-quality stills via mflux, 4-bit pre-quantized (doc 18 §1)"
    runtime: hf
    source: "mflux-community/z-image-turbo-mflux-q4"
    size_gb: 5.9
    licence: apache-2.0
    commercial_use: true
    optional: true   # pull instead of / after klein when disk allows
    verified: true
    verified_how: "HF file-tree API via doc 18 research: 5.89 GB. Same files as filipstrand/Z-Image-Turbo-mflux-4bit. The q8 build (11 GB) and base repo (32.9 GB) are disk traps"

  # ---------------------------------------------------------------- Video
  - name: depth-anything-v2-small
    stage: video
    purpose: "Monocular depth for 2.5D parallax b-roll (DepthFlow), the default motion layer (doc 18 §2)"
    runtime: hf
    source: "apple/coreml-depth-anything-v2-small"
    size_gb: 0.1
    licence: apache-2.0
    commercial_use: true
    optional: false
    verified: false
    verified_how: "Doc 18 research: ~50-99 MB, Apache-2.0 (Small only; Base/Large are non-commercial). DepthFlow (AGPL-3.0, pip) may fetch its own depth model; check before pulling"

  - name: wan2.2-ti2v-5b-turbo-gguf
    stage: video
    purpose: "Real image-to-video hero clips, 4-step distill, via stable-diffusion.cpp (doc 18 §2)"
    runtime: hf
    source: "jc-builds/Wan2.2-TI2V-5B-Turbo-iOS"
    size_gb: 6.0
    licence: apache-2.0
    commercial_use: true
    optional: true   # ~6 GB; pull once ~16 GB is free. Turbo distill's upstream licence is unstated
    verified: false
    verified_how: "Doc 18 research: DiT Q4_K_S 3.1 GB + umT5 Q3_K_S 2.9 GB + TAE 23 MB. M2 24 GB measured ~96 s for 13 frames at 480x832. Upstream quanhaol/Wan2.2-TI2V-5B-Turbo states no licence; FastWan2.2 (Apache) is the clean fallback"

  # ---------------------------------------------------------------- Music
  - name: ace-step-1.5
    stage: music
    purpose: "One-night instrumental bed library per channel (doc 14 §8)"
    runtime: hf
    source: "ACE-Step/Ace-Step1.5"
    size_gb: 10.1
    licence: mit
    commercial_use: true
    optional: true   # music: build each channel library once when space allows
    verified: true
    verified_how: "HF API: repo exists, licence mit, 10.09 GB (turbo DiT 4.8 + 5Hz LM 1.7B 3.7 + Qwen3-Embedding 1.2 + VAE). Code: github.com/ace-step/ACE-Step-1.5 (may fetch the same weights itself)"
