# Local model manifest for the recommended stack in docs 14 (Apple M4 Pro, 24 GB).
#
# Read by scripts/setup/00-preflight.sh (disk requirement), 20-pull-models.sh
# (downloads) and 30-smoke-test.sh (presence checks) via scripts/setup/manifest.py.
#
# Fields
#   name            short id used by the scripts
#   stage           llm | tts | asr | image | music
#   purpose         what the pipeline uses it for
#   runtime         ollama (pulled with `ollama pull`) | hf (Hugging Face repo download)
#   source          Ollama tag or HF repo id
#   include         optional HF allow-patterns (only these files are downloaded)
#   size_gb         approximate download size, GB (decimal)
#   licence         weights licence (SPDX-ish)
#   commercial_use  true only for licences that allow monetised channels
# Default pull set (no --include-optional) = every `optional: false` model (Configuration A:
# Kokoro, parakeet, Z-Image-Turbo q4, Real-ESRGAN, Depth Anything V2 Small). Text runs on
# Bedrock / Claude Code, so every llm model is optional.
#
#   optional        true = not pulled by default (needs --include-optional), not in the
#                   required disk total
#   verified        what was checked on 2026-10-16 (see `verified_how`); false = unverified
#
# Only commercially usable weights belong here. Non-commercial models (FLUX.1-dev,
# FLUX.2-klein-9B, Qwen-Image-2.1, F5-TTS, MusicGen, Higgs TTS 3) are excluded on purpose.

version: 1
checked: "2026-10-16"
disk_buffer_gb: 10

models:
  # ---------------------------------------------------------------- LLM
  # All optional: text runs on Bedrock / Claude Code (studio/llm). Kept for offline experiments.
  - name: qwen3.5-9b
    stage: llm
    purpose: "Workhorse: scripts, hooks, titles, tags, JSON metadata (doc 14 §3)"
    runtime: ollama
    source: "qwen3.5:9b"
    size_gb: 7.6
    licence: apache-2.0
    commercial_use: true
    optional: true   # text runs on Bedrock / Claude Code
    verified: true
    verified_how: "tag listed on ollama.com/library/qwen3.5/tags (7.6 GB); HF Qwen/Qwen3.5-9B licence apache-2.0"

  - name: gemma4-12b
    stage: llm
    purpose: "Workhorse alternative for A/B on voice and tone (doc 14 §3)"
    runtime: ollama
    source: "gemma4:12b"
    size_gb: 7.7
    licence: apache-2.0
    commercial_use: true
    optional: true   # text runs on Bedrock / Claude Code
    verified: true
    verified_how: "tag listed on ollama.com/library/gemma4/tags (7.7 GB); HF google/gemma-4-12B-it licence apache-2.0"

  - name: gpt-oss-20b
    stage: llm
    purpose: "Smart pass: fact-check critic, outline, planner agent (doc 14 §3)"
    runtime: ollama
    source: "gpt-oss:20b"
    size_gb: 14.0
    licence: apache-2.0
    commercial_use: true
    optional: true   # text runs on Bedrock / Claude Code (incl. fact-check)
    verified: true
    verified_how: "tag listed on ollama.com/library/gpt-oss/tags (14 GB); HF openai/gpt-oss-20b licence apache-2.0"

  # ---------------------------------------------------------------- TTS
  - name: kokoro-82m
    stage: tts
    purpose: "Default narrator via mlx-audio, preset/blended voices only (doc 14 §4)"
    runtime: hf
    source: "mlx-community/Kokoro-82M-bf16"
    # skip the duplicate voices/*.pt (torch) copies; mlx-audio loads voices/*.safetensors
    include: ["*.json", "*.safetensors", "voices/*.safetensors", "*.md", "*.txt"]
    size_gb: 0.4
    licence: apache-2.0
    commercial_use: true
    optional: false
    verified: true
    verified_how: "HF API: repo exists, licence apache-2.0, 0.39 GB. Upstream: hexgrad/Kokoro-82M"

  # ---------------------------------------------------------------- ASR
  - name: parakeet-tdt-0.6b-v2
    stage: asr
    purpose: "Word-level caption timings via parakeet-mlx (doc 14 §5). Credit NVIDIA (CC-BY-4.0)"
    runtime: hf
    source: "mlx-community/parakeet-tdt-0.6b-v2"
    size_gb: 2.5
    licence: cc-by-4.0
    commercial_use: true
    optional: false
    verified: true
    verified_how: "HF API: repo exists, licence cc-by-4.0, model.safetensors 2.47 GB"

  # ---------------------------------------------------------------- Image
  - name: flux2-klein-4b-q4
    stage: image
    purpose: "Alternative local still model via mflux, 4-bit pre-quantized; faster, weaker text (doc 18 §1)"
    runtime: hf
    source: "mflux-community/flux2-klein-4b-mflux-q4"
    size_gb: 4.6
    licence: apache-2.0
    commercial_use: true
    optional: true   # Configuration A uses Z-Image-Turbo q4; pull klein only for A/B tests
    verified: true
    verified_how: "HF file-tree API via doc 18 research: 4.57 GB (transformer 2.15, Qwen3 TE 2.27, VAE 0.17). M1 Max 31.7 s/image measured (lilting.ch). mflux --model <repo> form NOT yet tested"

  - name: z-image-turbo-q4
    stage: image
    purpose: "Default local still model (Configuration A) via mflux, 4-bit pre-quantized (doc 18 §1)"
    runtime: hf
    source: "mflux-community/z-image-turbo-mflux-q4"
    size_gb: 5.9
    licence: apache-2.0
    commercial_use: true
    optional: false
    verified: true
    verified_how: "HF file-tree API via doc 18 research: 5.89 GB. Same files as filipstrand/Z-Image-Turbo-mflux-4bit. The q8 build (11 GB) and base repo (32.9 GB) are disk traps. mflux 0.23 loads it with `mflux-generate-z-image-turbo --model <repo>` (2026-10-16)"

  - name: sdxs-512-dreamshaper-q8
    stage: image
    purpose: "~1 GB 1-step SD for fast filler/atmosphere stills at 512x896 + ESRGAN upscale (doc 18 §8)"
    runtime: hf
    source: "concedo/sdxs-512-tinySDdistilled-GGUF"
    include: ["sdxs-512-tinySDdistilled_Q8_0.gguf"]
    size_gb: 0.68
    licence: openrail++
    commercial_use: true
    optional: true   # fits today; keep FLUX klein for structurally-accurate frames
    verified: false
    verified_how: "Doc 18 §8: 683 MB per HF listing; card targets KoboldCpp >=1.107, sd.cpp loading untested (fallback akleine/sdxs-512 fp16, 883 MB)"

  # ---------------------------------------------------------------- Video
  - name: depth-anything-v2-small
    stage: video
    purpose: "Monocular depth for 2.5D parallax b-roll, the default motion layer, run with torch/transformers on MPS by studio/stages/motion.py (doc 18 §2, §6)"
    runtime: hf
    source: "depth-anything/Depth-Anything-V2-Small-hf"
    include: ["config.json", "preprocessor_config.json", "model.safetensors", "README.md"]
    size_gb: 0.1
    licence: apache-2.0
    commercial_use: true
    optional: false
    verified: true
    verified_how: "2026-10-16 HF API: card licence apache-2.0, model.safetensors 99.2 MB (Small only; Base/Large are CC-BY-NC). Used with OUR OWN OpenCV remap parallax (studio/stages/motion.py), not AGPL DepthFlow (doc 18 §6)"

  - name: fastwan2.2-ti2v-5b-gguf
    stage: video
    purpose: "Image-to-video hero clips, 3-step DMD distill of Wan2.2-TI2V-5B, via stable-diffusion.cpp (doc 18 §6)"
    runtime: hf
    source: "Green-Sky/FastWan2.2-TI2V-5B-FullAttn-GGUF"
    size_gb: 7.1
    licence: apache-2.0
    commercial_use: true
    optional: true   # needs ~17 GB free; pair with city96/umt5-xxl-encoder-gguf Q3_K_S + taew2_2
    verified: false
    verified_how: "Doc 18 round 2: DiT q6_k 4.21 GB (+ umT5 Q3_K_S 2.86 + taew2_2 0.02 = 7.1 GB). Apache at every layer, replacing Wan2.2-Turbo (distill repo has no licence). DMD timesteps vs sd.cpp scheduler unverified"

  - name: wan2.1-t2v-1.3b-gguf
    stage: video
    purpose: "Text-to-video generic cutaways (clouds, traffic, machinery), via stable-diffusion.cpp; NOT image-to-video (doc 18 §7)"
    runtime: hf
    source: "calcuis/wan-1.3b-gguf"
    size_gb: 4.5
    licence: apache-2.0
    commercial_use: true
    optional: true   # ~4.5 GB with umT5 Q3_K_S (city96/umt5-xxl-encoder-gguf) + Wan2.1 VAE; needs ~15 GB free
    verified: false
    verified_how: "Doc 18 research: DiT ~1.4 GB (Q8) + umT5 Q3_K_S 2.86 + VAE 0.25. Exact GGUF filenames in calcuis/wan-1.3b-gguf not checked. Undistilled: est. 3-6 min/clip on M4 Pro. Avoid CausVid/Self-Forcing distills (CC-BY-NC-SA)"

  - name: lingbot-video-dense-1.3b-gguf
    stage: video
    purpose: "Smallest commercial I2V (<=4 GB), Qwen3-VL-4B text encoder; slow (not distilled), overnight only (doc 18 §6)"
    runtime: hf
    source: "offgrid-ai/LingBot-Video-Dense-1.3B-GGUF"
    size_gb: 3.5
    licence: apache-2.0
    commercial_use: true
    optional: true
    verified: false
    verified_how: "Doc 18 round 2: DiT Q4 0.78 + Qwen3-VL-4B Q4_K_M 2.50 + Wan2.1 VAE 0.25. M4 Pro est. 10-25 min per clip"

  - name: realesrgan-x4plus
    stage: image
    purpose: "Tiny 4x upscaler: render stills at 544x960 then upscale, about 2x faster (doc 18 §5)"
    runtime: hf
    source: "Comfy-Org/Real-ESRGAN_repackaged"
    include: ["RealESRGAN_x4plus.safetensors", "README.md"]
    size_gb: 0.07
    licence: bsd-3-clause
    commercial_use: true
    optional: false
    verified: true
    verified_how: "2026-10-16 HF API: card licence bsd-3-clause, RealESRGAN_x4plus.safetensors 66.9 MB; loaded with spandrel on MPS by studio/stages/visuals/upscale.py. Doc 18 round 2: Core ML/MLX ports exist (mlboydaisuke/Real-ESRGAN-x4-CoreML, themindstudio/RealESRGAN-x4plus-mlx); ~1-1.3 s per 512->2048 on M4 (derivative.ca)"

  - name: flux2-klein-sana-sprint-lora
    stage: image
    purpose: "2-step LoRA for klein 4B: the only route to <=8 s/image (doc 18 §5)"
    runtime: hf
    source: "radames/FLUX.2-klein-Sana-Sprint"
    size_gb: 0.77
    licence: apache-2.0
    commercial_use: true
    optional: true
    verified: false
    verified_how: "Doc 18 round 2: card says 2 steps match 4-step detail, warmer/higher contrast. Untested in mflux --lora-paths"

  - name: flux2-klein-4b-q3
    stage: image
    purpose: "Smallest acceptable stills model (3.6 GB); quality loss vs q4 unmeasured (doc 18 §5)"
    runtime: hf
    source: "mflux-community/flux2-klein-4b-mflux-q3"
    size_gb: 3.6
    licence: apache-2.0
    commercial_use: true
    optional: true   # A/B against q4 on 10 diagram prompts before switching
    verified: true
    verified_how: "HF file-tree API: 1.70 + 1.76 + 0.16 GB; card documents --model <repo> --base-model flux2-klein-4b"

  # ---------------------------------------------------------------- Music
  - name: ace-step-1.5
    stage: music
    purpose: "One-night instrumental bed library per channel (doc 14 §8)"
    runtime: hf
    source: "ACE-Step/Ace-Step1.5"
    size_gb: 10.1
    licence: mit
    commercial_use: true
    optional: true   # music: build each channel library once when space allows
    verified: true
    verified_how: "HF API: repo exists, licence mit, 10.09 GB (turbo DiT 4.8 + 5Hz LM 1.7B 3.7 + Qwen3-Embedding 1.2 + VAE). Code: github.com/ace-step/ACE-Step-1.5 (may fetch the same weights itself)"
