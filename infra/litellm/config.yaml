# LiteLLM proxy (STUDIO_LLM=gateway): one OpenAI-compatible endpoint in front of Amazon Bedrock.
# Follows docs 15 §7.4, revised 2026-10-16: every text role runs on Bedrock and there is no
# local default. No credentials are stored here; every secret comes from env:
#   AWS_BEARER_TOKEN_BEDROCK  Bedrock API key (personal AWS account, never an employer one).
#                             LiteLLM's Bedrock provider reads it from env as `api_key`.
#   AWS_REGION                e.g. us-east-1 (source Region for the global.* profiles)
#   LITELLM_MASTER_KEY        admin key for the proxy; give each channel its own virtual key
# If you use AWS_PROFILE instead of an API key, swap `api_key` for
#   aws_profile_name: os.environ/AWS_PROFILE
# Model-group names (bedrock-haiku/sonnet/opus) must match studio/llm/routing.py.
# IDs verified against the Bedrock model cards (Programmatic Access) on 2026-10-16.
#
# Your own model IDs (BEDROCK_MODEL_ID_FAST / _QUALITY / _ESCALATION in .env): LiteLLM's
# `os.environ/VAR` replaces the WHOLE value, with no default and no interpolation (checked in
# the LiteLLM 1.101.0 source, secret_managers/main.py:get_secret), and an empty var resolves
# to "" (a broken model id). So the Claude defaults stay literal below. Once a variable is
# filled in, uncomment the matching `model_id:` line: LiteLLM then sends that id (base id,
# us./global. profile or ARN) as the Converse modelId. For a NON-Claude model also change
# `model:` to bedrock/converse/<that id> so LiteLLM maps params for the right family.
# See infra/README.md.
# Set tpm to about 80% of the APPLIED quota.

model_list:
  - model_name: bedrock-haiku                    # ideation, outline, draft, metadata, ...
    litellm_params:
      model: bedrock/converse/global.anthropic.claude-haiku-5-5
      # model_id: os.environ/BEDROCK_MODEL_ID_FAST   # uncomment once set in .env
      api_key: os.environ/AWS_BEARER_TOKEN_BEDROCK
      aws_region_name: os.environ/AWS_REGION
      tpm: 200000
  - model_name: bedrock-sonnet                   # polish, fact_check, title_rank
    litellm_params:
      model: bedrock/converse/global.anthropic.claude-sonnet-5-5
      # model_id: os.environ/BEDROCK_MODEL_ID_QUALITY   # uncomment once set in .env
      api_key: os.environ/AWS_BEARER_TOKEN_BEDROCK
      aws_region_name: os.environ/AWS_REGION
      tpm: 200000
  - model_name: bedrock-opus                     # dispute escalation only
    litellm_params:
      model: bedrock/converse/global.anthropic.claude-opus-5-5
      # model_id: os.environ/BEDROCK_MODEL_ID_ESCALATION   # uncomment once set in .env
      api_key: os.environ/AWS_BEARER_TOKEN_BEDROCK
      aws_region_name: os.environ/AWS_REGION
      tpm: 100000
  # Optional, opt-in only (not used by the default routing): a local Ollama group.
  # - model_name: local-bulk
  #   litellm_params:
  #     model: ollama_chat/qwen3.5:9b
  #     api_base: os.environ/OLLAMA_BASE_URL

litellm_settings:
  num_retries: 3              # per model group, before fallbacks
  allowed_fails: 3
  cooldown_time: 30
  request_timeout: 600
  drop_params: true
  max_budget: 30              # USD, proxy-wide outer guard (infra/LLM_COSTS.md)
  budget_duration: 30d

router_settings:
  enable_pre_call_checks: true
  fallbacks:
    - {"bedrock-opus": ["bedrock-sonnet"]}    # quality tier steps down, never to local
  # bedrock-haiku and bedrock-sonnet have NO fallback. The app catches 429 and re-enqueues
  # them (BudgetDeferred).

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Per-channel virtual keys (max_budget, budget_duration: 30d) need a database:
  # database_url: os.environ/LITELLM_DATABASE_URL
