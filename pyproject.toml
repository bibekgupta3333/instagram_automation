[project]
name = "studio"
version = "0.1.0"
description = "Local-first AI video studio for 10 faceless/avatar channels (see docs/)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
# Heavy local ML stack (docs/4-production/14). Install only when disk space allows.
local-ml = ["mlx-audio", "parakeet-mlx", "mflux"]
bedrock = ["boto3>=1.35"]
gateway = ["litellm[proxy]"]
flows = ["prefect>=3.0"]

[project.scripts]
studio = "studio.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.ruff]
line-length = 100
