[project]
name = "studio"
version = "0.1.0"
description = "Local-first AI video studio for 10 faceless/avatar channels (see docs/)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=10,<13",
]
# Local ML (docs/4-production/14). Text runs on Bedrock / Claude Code, so no local LLMs.
# local-audio: Kokoro-82M TTS (mlx-audio) + word-timestamp captions (parakeet-mlx).
# mlx-audio does not declare Kokoro's G2P: it imports `misaki` at runtime. `misaki[en]` would
# drag in spacy-curated-transformers -> torch (~0.4 GB), but the default (trf=False) path only
# needs spacy + the small English model, so we list misaki's English deps by hand.
local-audio = [
  "mlx-audio>=0.5.9",
  "parakeet-mlx>=0.5.3",
  "misaki>=0.9.4",
  "num2words>=0.5.14",
  "spacy>=3.8,<3.9",
  "en-core-web-sm",
  "phonemizer-fork>=3.3",
  "espeakng-loader>=0.2.4",
]
local-image = ["mflux>=0.23", "opencv-python-headless>=4.10", "spandrel>=0.4"]  # images (Z-Image 4-bit), parallax, ESRGAN (doc 18)
local-ml = ["studio[local-audio,local-image]"]  # compatibility: union of the two
bedrock = ["boto3>=1.39"]  # 1.39+ reads AWS_BEARER_TOKEN_BEDROCK (Bedrock API keys)
gateway = ["litellm[proxy]"]
flows = ["prefect>=3.0"]
# Private-only YouTube uploads (studio/publish/youtube.py, scripts/youtube_upload.py; infra/YOUTUBE.md)
youtube = ["google-api-python-client>=2.201.0", "google-auth-oauthlib>=1.5.0", "google-auth>=2.62.0"]

[project.scripts]
studio = "studio.cli:app"

[tool.uv.sources]
# spaCy model used by misaki's English G2P (spacy.cli.download needs pip, absent in uv venvs).
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["output", ".venv", ".venv-web", "node_modules"]
