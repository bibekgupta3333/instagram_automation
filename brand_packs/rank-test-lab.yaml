# Doc 13 §3.10 · Batch C · faceless: own screen recordings, charts + voice-over (HeyGen avatar "Theo" retired 2026-10-16)
slug: rank-test-lab
name: Rank Test Lab
handle: "@ranktestlab"
niche: Real SEO, local-search and ads experiments on our own small test sites, for US small businesses (B2B)
presenter: faceless
palette: ["#16302B", "#F4F1EA", "#FF5A36"]
voice: {engine: kokoro, voice: am_liam, speed: 1.05}
platforms: [youtube_shorts, youtube_long, instagram_reels, facebook_reels]
shorts_per_day: 1.0
