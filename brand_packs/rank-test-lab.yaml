  - "contrarian: 'Backlinks weren't what moved our page first.'"
  - "stakes: 'We spent $100 on ads for a fake bakery. Here's every click.'"
banned_templates:
  - "hey guys"
  - "welcome back to"
  - "in this video"
  - "without further ado"
  - "let's dive in"
  - "smash that like"
  - "like and subscribe"
  - "don't forget to subscribe"
  - "thanks for watching"
  - "rank #1 overnight"
