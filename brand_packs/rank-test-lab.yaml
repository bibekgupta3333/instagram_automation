  - "never kid-appealing; Not made for kids on every video (11 §5)"
  - "disclose affiliate links spoken and on screen before the endorsement (17)"
  - "no income guarantees or 'make money online' / passive-income framing (FTC earnings-claim risk, 17)"
  - "no fake-review, bought-follower, bot or black-hat tactics (17)"
  - "no undisclosed SaaS affiliate links (17)"
  - "experiments only on sites we own; results vary and are shown in full"
  - "the narrator is an AI-generated voice; never claim to be human; never imply Google affiliation"
accuracy_critical: false
ai_disclosure: true
made_for_kids: false
